  - text: " building critical high-availability systems for the financial sector — migrating an on-premise monolith to AWS microservices (15s → 70ms), rebuilding a document pipeline in Go (60s → 500ms, 40k transactions a day), and eliminating 400 critical vulnerabilities across 13 legacy apps. I use AI as a force multiplier across the full development lifecycle: spec-driven planning, MCP servers, and internal tooling that compress weeks of modernization work into days. When I'm not on Kubernetes, I cook, explore flea markets, and shoot analog photography."

